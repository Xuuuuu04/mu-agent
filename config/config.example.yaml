model:
  primary:
    name: minimax-m3
    format: anthropic
    base_url: https://api.minimaxi.com/anthropic
    api_key: YOUR_API_KEY_HERE
    model: minimax-m3
    max_tokens: 4096
    supports_cache: true

  # 主模型挂了的兜底链,按顺序尝试
  # fallback:
  #   - name: glm
  #     format: anthropic
  #     base_url: https://open.bigmodel.cn/api/anthropic
  #     api_key: YOUR_GLM_KEY
  #     model: glm-4.6
  #   - name: deepseek
  #     format: openai
  #     base_url: https://api.deepseek.com
  #     api_key: YOUR_DEEPSEEK_KEY
  #     model: deepseek-chat

  # 辅助模型:嵌入用于语义检索,整合可用便宜模型省钱
  # auxiliary:
  #   embedding:
  #     name: bge-m3
  #     format: openai
  #     base_url: https://api.siliconflow.cn/v1
  #     api_key: YOUR_SILICONFLOW_KEY
  #     model: BAAI/bge-m3
  #   consolidation:
  #     name: minimax-m3
  #     format: anthropic
  #     base_url: https://api.minimaxi.com/anthropic
