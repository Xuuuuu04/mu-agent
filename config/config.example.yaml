  #     model: minimax-m3

scheduler:
  min_wake_seconds: 300          # 最短 5 分钟,防刷屏
  max_wake_seconds: 14400        # 最长 4 小时,防消失
  cron_fallback_seconds: 7200    # cron 兜底每 2 小时查一次
  night_min_wake_seconds: 3600   # 深夜最短 1 小时,省 token
  night_start_hour: 1
  night_end_hour: 7
  # A 股垂直化(默认关)。开了之后交易日盘中(morning/afternoon,非 closed)会用更紧的下限更频繁醒来盯盘;
  # 夜间/closed/未配置仍走旧规则。enabled 缺省 = 完全不启用,行为与不写这段一致。
  # 模板见 config/trade-calendar.example.json,拷到 data/memory/trade-calendar.json 按年维护。
  # a_stock:
  #   enabled: true
  #   calendar_path: ./data/memory/trade-calendar.json
  #   market_min_wake_seconds: 120   # 盘中最短 2 分钟醒一次盯盘

agent:
  max_turns_per_cycle: 20        # 单 cycle 最大工具轮数,防死循环
  session_timeout_minutes: 30    # 超过这么久没说话,会话归档生成摘要

paths:
  soul: ./soul
  data: ./data
  tools: ./data/tools

# 主动通信(F8)。默认关。开了沐会在想念/承诺到期时主动找你
# proactive:
#   enabled: true
#   max_per_hour: 5
#   quiet_start_hour: 1            # 深夜不打扰
#   quiet_end_hour: 8

# 微信网关。默认关,xpark 上接好 WeChatFerry 再开
# wechat:
#   enabled: true
#   host: 127.0.0.1
#   port: 10086
#   self_wxid: wxid_xxxxx         # 沐自己的 wxid,群里判断 @ 用

# 外部 MCP server。启动时连接,工具自动并入
