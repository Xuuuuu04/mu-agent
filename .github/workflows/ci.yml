name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # pretest 会先跑 tsc --noEmit,再跑 node:test 全套
      - run: pnpm test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # bridge 纯逻辑(零依赖 unittest)
      - run: python -m unittest scripts.test_bridge_pure
